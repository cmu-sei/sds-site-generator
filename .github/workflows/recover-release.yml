name: Recovery - Discard or Cancel Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Discard before merge; cancel after merge (unpublished only)
        type: choice
        options: [discard, cancel]
        required: true
      version:
        description: Exact prepared version, including beta suffix if present
        type: string
        required: true
      confirmation:
        description: Retype its exact version (for example 0.2.0-beta.1)
        type: string
        required: true

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
  RECOVERY_MODE: ${{ inputs.mode }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  stop:
    name: Block publication and stop active release jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: node scripts/release.mjs stop

  recover:
    name: Clean up preparation or open a reviewed revert
    needs: stop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-state
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - run: node scripts/release.mjs recover
