name: Automatic - Publish Release
run-name: 'Publish release PR #${{ github.event.pull_request.number }}'

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  identity:
    name: Validate merged release PR
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release.mjs validate

  build:
    name: Validate and build release
    needs: identity
    uses: ./.github/workflows/check.yml
    with:
      commit: ${{ github.event.pull_request.merge_commit_sha }}

  publish:
    name: Publish tested package and binaries
    needs: [identity, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ needs.identity.outputs.dist-tag == 'latest' && 'github-packages-production' || 'github-packages-beta' }}
    concurrency:
      group: release-state
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      pull-requests: read
    outputs:
      dist-tag: ${{ steps.publish.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle
          path: release-artifacts/
      - name: Finalize the reviewed release (safe to retry)
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release.mjs publish
      - name: Hand off the published stable release to Pages
        if: steps.publish.outputs.dist-tag == 'latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pages-release
          path: pages-release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
