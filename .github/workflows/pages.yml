name: Deploy documentation to Pages

on:
  workflow_run:
    workflows: [Automatic - Publish Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Published latest stable tag to deploy (for example v0.2.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build released documentation
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
      pages: read
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - name: Download the completed publication handoff
        if: github.event_name == 'workflow_run'
        id: handoff
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pages-release
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the stable release identity
        if: github.event_name == 'workflow_dispatch' || steps.handoff.outcome == 'success'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_TAG: ${{ inputs.tag }}
        run: node scripts/release.mjs pages
      - name: Explain a skipped handoff
        if: github.event_name == 'workflow_run' && steps.handoff.outcome != 'success'
        run: echo 'No stable release handoff. Beta/non-release runs are skipped. Retry a failed stable handoff manually with its published tag.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the verified release identity
        if: steps.release.outputs.deploy == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-pages-release
          path: pages-release.json
          overwrite: true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        if: steps.release.outputs.deploy == 'true'
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - run: npm ci --ignore-scripts
        if: steps.release.outputs.deploy == 'true'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        if: steps.release.outputs.deploy == 'true'
        with:
          toolchain: stable
      - run: npm run build:generator
        if: steps.release.outputs.deploy == 'true'
      - name: Configure Pages
        if: steps.release.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build at the actual Pages URL
        if: steps.release.outputs.deploy == 'true'
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/package.mjs pages "$PAGES_URL"
      - name: Select this build attempt's Pages artifact
        if: steps.release.outputs.deploy == 'true'
        id: artifact
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: steps.release.outputs.deploy == 'true'
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: pages-dist/

  deploy:
    name: Deploy released documentation
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
      - run: npm install --global npm@12.2.1
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-pages-release
          path: .
      - name: Recheck latest after deployment approval
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs pages
      - name: Deploy Pages artifact
        if: steps.release.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@decdde0ac072f6dda1fc67b7b8ccf9db8eecbd56
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
